 else{const cc=crewCost(n,s.crew);let miss=0,rows='';for(const k in P.m){const have=s.mat[k]||0,need=P.m[k];if(have<need)miss+=(need-have)*MT[k].p;rows+=`<div class="rw"><span>${MT[k].e} ${MT[k].n}</span><b style="color:${have>=need?'#128a4f':'#b3123d'}">${have}/${need}</b></div>`}
  h+=`<h3>Next: ${P.n}</h3>${rows}<div class="chips">${Object.keys(CR).map(k=>chip(CR[k].t,k==s.crew,`setCrew('${k}')`)).join('')}</div><p class="note">Labor ₱${fmt(cc.l)} + meals ₱${fmt(cc.m)} · about ${cc.s}s of work</p>`;
  if(miss)h+=`<button class="go alt" onclick="buyMissing()">Buy missing materials · ₱${fmt(miss)}</button>`;
  h+=`<button class="go" ${miss||s.cash<cc.l+cc.m?'disabled':''} onclick="startProj()">Start · pay ₱${fmt(cc.l+cc.m)}</button>`}
 h+='<h3>Design</h3><p class="note">Exterior color (level 5):</p><div class="chips">'+[0xf2e4b8,0xff8f5a,0x3cc6d9,0xe8337f,0x9b6bd8].map((c,i)=>`<button class="sw ${s.theme==i?'sel':''}" style="background:#${c.toString(16).padStart(6,'0')}" onclick="setTheme(${i})" aria-label="Color ${i+1}"></button>`).join('')+'</div>';
 h+=`<p class="note">Interior: buy furniture and appliances in the Shop. Owned: ${s.items.length?s.items.map(i=>SH.find(x=>x.id==i).e).join(' '):'none yet'}</p><button class="go alt" onclick="openM(pgShop)">🛒 Open Shop</button>`;return h}
function pgShop(){let h=head('🛒 Shop')+'<div class="chips">'+['Food & Supplies','Materials','Appliances','Furniture','Services'].map(c=>chip(c,c==SHC,`SHC='${c}';pg()`)).join('')+'</div>';
 SH.filter(x=>x.c==SHC).forEach(x=>{const own=x.t=='own'&&s.items.includes(x.id),st=x.t=='inv'?s.inv[x.id]||0:x.t=='mat'?s.mat[x.id]||0:null;
  h+=`<div class="rw"><span>${x.e} ${x.n}<small>${x.d}${st!=null?' · in stock: '+st:''}</small></span><span class="pr">₱${fmt(x.p)}</span>${own?'<b>Owned ✔</b>':`<button class="mini" onclick="buy('${x.id}',1)">Buy</button>`+(x.t=='inv'||x.t=='mat'?`<button class="mini" onclick="buy('${x.id}',5)">×5</button>`:'')}</div>`});return h}
function pgStaff(){const tot=s.staff.reduce((a,r)=>a+ROLES.find(x=>x.r==r).w,0);let h=head('👥 Staff')+`<p class="note">Daily payroll: <b>₱${fmt(tot)}</b>, paid at dawn each day.</p>`;
 ROLES.forEach(o=>{const on=has(o.r);h+=`<div class="rw"><span>${o.e} ${o.n}<small>${o.d}</small></span><span class="pr">₱${o.w}/day</span><button class="mini ${on?'red':''}" onclick="${on?'fire':'hire'}('${o.r}')">${on?'Fire':'Hire'}</button></div>`});return h}
function pgDash(){const n=s.revs.length,cnt=[1,2,3,4,5].map(k=>s.revs.filter(r=>r.s==k).length);let h=head('📊 Dashboard')+`<div class="gs"><span>⭐ <b>${s.rep.toFixed(2)}</b> / 5</span><span>${s.rn} reviews</span><span>Earned ₱${fmt(s.earn)}</span><span>Day ${s.day}</span></div>`;
 h+=[5,4,3,2,1].map(k=>`<div class="rw"><span>${'⭐'.repeat(k)}</span><div class="bar2"><i style="width:${n?100*cnt[k-1]/n:0}%"></i></div><b>${cnt[k-1]}</b></div>`).join('');
 h+=`<p class="note">Ranking uses your cash and your star rating. <button class="mini" onclick="closeM();$('lb').click()">🏆 Open leaderboard</button></p><h3>Recent reviews</h3>`;
 h+=n?s.revs.slice(0,8).map(r=>`<div class="rw"><span>${'⭐'.repeat(r.s)} <b>${r.n}</b><small>${r.t} (day ${r.d})</small></span></div>`).join(''):'<p class="note">No reviews yet. Welcome your first guest!</p>';return h}
const handHtml=()=>`<div class="gs">✋ At hand: <b>${handStr()||'nothing'}</b></div>`;
function pgStock(title,keys,fr){let h=head(title);if(fr&&s.bad.fridge)h+='<p class="warn">⚠ The fridge is broken. Repair it to take food.</p>';h+=handHtml()+'<p class="note">Tap an item to take it. Then walk to the guest and tap their request bubble.</p>';
 keys.forEach(k=>{const it=SH.find(x=>x.id==k),n=s.inv[k]||0,rq=C.reduce((a,c)=>a+(c.st=='stay'?c.rq.filter(q=>q.st=='act'&&q.k==k).length:0),0),off=n<1||(fr&&s.bad.fridge);
  h+=`<div class="rw" ${off?'':`onclick="takeItem('${k}')" style="cursor:pointer"`}><span>${it.e} ${it.n}<small>In stock: ${n}${rq?' · <b style="color:#b3123d">Requested now: '+rq+'</b>':''}</small></span><button class="mini" ${off?'disabled':''}>Take</button></div>`});
 return h+'<button class="go alt" onclick="closeM()">Done</button>'}
function pgInv(){const it=k=>SH.find(x=>x.id==k),hd=Object.entries(s.hand).filter(e=>e[1]>0);let h=head('🎒 Inventory')+'<h3>✋ At hand</h3>';
 h+=hd.length?hd.map(([k,n])=>`<div class="rw"><span>${it(k).e} ${it(k).n}</span><b>×${n}</b><button class="mini" onclick="putBack('${k}')">Put back</button></div>`).join(''):'<p class="note">Nothing in hand. Tap the KITCHEN or STORAGE label in the house to take items.</p>';
 const sec=(t,ks)=>`<h3>${t}</h3>`+ks.map(k=>`<div class="rw"><span>${it(k).e} ${it(k).n}</span><b>×${s.inv[k]||0}</b></div>`).join('');
 h+=sec('🍳 Kitchen',['meal','drink'])+sec('📦 Storage',['linen','towel','kit','part']);
 const mt=Object.keys(s.mat).filter(k=>s.mat[k]>0);h+='<h3>🧱 Renovation materials</h3>'+(mt.length?mt.map(k=>`<div class="rw"><span>${MT[k].e} ${MT[k].n}</span><b>×${s.mat[k]}</b></div>`).join(''):'<p class="note">None. Buy materials in the Shop.</p>');
 h+='<h3>🛋️ Furniture and appliances</h3>'+(s.items.length?s.items.map(k=>`<div class="rw"><span>${it(k).e} ${it(k).n}</span><b>Owned ✔</b></div>`).join(''):'<p class="note">None yet.</p>');
 h+='<h3>👥 Staff</h3>'+(s.staff.length?s.staff.map(r=>{const o=ROLES.find(x=>x.r==r);return`<div class="rw"><span>${o.e} ${o.n}</span><b>₱${o.w}/day</b></div>`}).join(''):'<p class="note">No staff hired.</p>');
 return h+`<p class="note">Cash: <b>₱${fmt(s.cash)}</b></p>`}
function setCrew(k){s.crew=k;pg()}function setTheme(i){s.theme=i;house(s.done);save();pg()}
function buyMissing(){const P=PH[s.done];let c=0;for(const k in P.m)c+=Math.max(0,P.m[k]-(s.mat[k]||0))*MT[k].p;if(s.cash<c)return toast('Not enough cash for the materials');s.cash-=c;for(const k in P.m)s.mat[k]=Math.max(s.mat[k]||0,P.m[k]);sfx();save();pg()}
function startProj(){const P=PH[s.done],cc=crewCost(s.done,s.crew);for(const k in P.m)if((s.mat[k]||0)<P.m[k])return;if(s.cash<cc.l+cc.m)return toast('Not enough cash for the crew');
 for(const k in P.m)s.mat[k]-=P.m[k];s.cash-=cc.l+cc.m;s.proj={i:s.done,t:cc.s,T:cc.s};house(s.done);save();closeM();toast('Crew started: '+P.n)}
function useful(id){const F=FACS();return id=='elec'?s.bad.light:id=='tech'?F.some(f=>s.bad[f.id]&&f.id!='light'):F.some(f=>s.bad[f.id]||s.due[f.id]||(s.wear[f.id]||0)>30)}
function buy(id,q){const it=SH.find(x=>x.id==id),cost=it.p*q;if(it.t=='own'&&s.items.includes(id))return;if(s.cash<cost)return toast('Not enough cash');
 if(it.t=='svc'&&id!='deliv'&&!useful(id))return toast('Nothing to fix right now');s.cash-=cost;
 if(it.t=='inv')s.inv[id]=(s.inv[id]||0)+q;else if(it.t=='mat')s.mat[id]=(s.mat[id]||0)+q;else if(it.t=='own'){s.items.push(id);house(s.done)}
 else{const F=FACS();if(id=='elec')s.bad.light=false;if(id=='tech')F.forEach(f=>{if(f.id!='light')s.bad[f.id]=false});if(id=='crew')F.forEach(f=>{s.bad[f.id]=false;s.due[f.id]=false;s.wear[f.id]=0});if(id=='deliv'){s.inv.meal+=5;s.inv.drink+=5}toast(it.n+' done')}
 sfx();save();pg()}
function hire(r){const o=ROLES.find(x=>x.r==r);if(s.cash<o.w)return toast('Need ₱'+o.w+' for the first day wage');s.cash-=o.w;s.staff.push(r);syncStaff();toast(o.n+' hired');save();pg()}
function fire(r){s.staff=s.staff.filter(x=>x!=r);syncStaff();save();pg()}
$('bR').onclick=()=>openM(pgReno);$('bS').onclick=()=>openM(pgShop);$('bI').onclick=()=>openM(pgInv);$('bT').onclick=()=>openM(pgStaff);$('bD').onclick=()=>openM(pgDash);
pgStaff.live=pgDash.live=1;setInterval(()=>{if(PG&&PG.live)pg()},2000);
/* ---------- PWA + hooks ---------- */
window.Harong={bootTs,get:()=>s,set:x=>{s=norm(x);syncStaff();save()},
 visit:(n,nm)=>{vis=true;visT=0;house(n);[AV,...C,...W].forEach(e=>e.g.visible=false);$('vtxt').textContent='Visiting '+nm+'’s harong';$('vbar').style.display='flex';$('lab').style.display='none'}};
$('vback').onclick=()=>{vis=false;house(s.done);[AV,...C,...W].forEach(e=>e.g.visible=true);$('vbar').style.display='none';$('lab').style.display=''};
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
let dip;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;$('inst').hidden=false});
$('inst').onclick=async()=>{if(!dip)return;dip.prompt();await dip.userChoice;dip=null;$('inst').hidden=true};addEventListener('appinstalled',()=>{$('inst').hidden=true;toast('Harong installed')});
/* ---------- sound: bayan ambience (all synthesized, no files) ---------- */
let AC,master,snd=true;try{snd=localStorage.getItem('harong-snd')!=='off'}catch(e){}
const SCL=[146.83,196,220,246.94,293.66,329.63,392,440,493.88,587.33];
function note(f,v=.08,len=1.8){const t=AC.currentTime,g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0005,t+len);g.connect(master);
 [['triangle',f,1],['sine',f*2,.3]].forEach(([ty,fr,m])=>{const o=AC.createOscillator(),q=AC.createGain();o.type=ty;o.frequency.value=fr;q.gain.value=m;o.connect(q);q.connect(g);o.start(t);o.stop(t+len+.1)})}
function chirp(t,f){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*(1.15+Math.random()*.4),t+.07);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.1);o.connect(g);g.connect(master);o.start(t);o.stop(t+.12)}
function bird(){const f=2800+Math.random()*1800,k=2+Math.floor(Math.random()*4);for(let i=0;i<k;i++)chirp(AC.currentTime+i*.12,f*(1+(i%2)*.12));setTimeout(bird,2500+Math.random()*5500)}
let mi=4;function mel(){mi=Math.max(0,Math.min(SCL.length-1,mi+[-2,-1,-1,0,1,1,2][Math.random()*7|0]));note(SCL[mi]);if(Math.random()<.25)setTimeout(()=>note(SCL[mi]*1.5,.04,1.2),350);setTimeout(mel,600+Math.random()*1000)}
function sfx(){if(!AC||!snd)return;note(659.25,.06,.5);setTimeout(()=>note(880,.05,.6),110)}
function initAudio(){if(AC){AC.resume();return}
 AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=snd?.9:0;master.connect(AC.destination);
 const b=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const n=AC.createBufferSource();n.buffer=b;n.loop=true;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2400;bp.Q.value=.5;
 const g=AC.createGain();g.gain.value=.05;const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=.17;lg.gain.value=.04;l.connect(lg);lg.connect(g.gain);
 n.connect(bp);bp.connect(g);g.connect(master);n.start();l.start();
 const dr=AC.createOscillator(),dg=AC.createGain();dr.frequency.value=73.4;dg.gain.value=.025;dr.connect(dg);dg.connect(master);dr.start();
 setTimeout(bird,1200);setTimeout(mel,600)}
function snb(){$('snd').textContent=snd?'🔊':'🔇';if(master)master.gain.value=snd?.9:0}
$('snd').onclick=e=>{e.stopPropagation();snd=!snd;try{localStorage.setItem('harong-snd',snd?'on':'off')}catch(_){}initAudio();snb()};
document.addEventListener('pointerdown',()=>initAudio(),{once:true});snb();
document.addEventListener('visibilitychange',()=>{if(AC)document.hidden?AC.suspend():AC.resume()});


/* ---------- start ---------- */
const away=(Date.now()-s.ts)/1000;
resize();house(s.done);syncStaff();AV.g.position.set(AV.x,0,AV.z);
if(!fresh&&away>60){const days=Math.floor(Math.min(away,1800)/60),g=Math.round(days*cap()*rate()*.6),w=days*s.staff.reduce((a,r)=>a+ROLES.find(x=>x.r==r).w,0),net=Math.max(0,g-w);s.cash+=net;if(net>0)toast('Welcome back! Guests paid ₱'+fmt(net)+' while you were away')}
save();requestAnimationFrame(loop);

 uid=u.uid;
